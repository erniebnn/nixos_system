[bind.default]
"SUPER+T"           = "spawn,kitty"
"SUPER+Q"           = "killclient"
"SUPER+Shift+Q"     = "killclient,force"
"SUPER+F"           = "togglefullscreen"
"SUPER+C"           = "centerwin"
"SUPER+D"           = "spawn_shell,noctalia msg panel-toggle launcher"
"SUPER+L"           = "spawn_shell,noctalia msg session lock"
"SUPER+S"           = "spawn_shell,noctalia msg panel-toggle control-center"
"SUPER+I"           = "spawn_shell,noctalia msg settings-toggle"

"SUPER+Left"        = "focus_window_or_workspace,left"
"SUPER+Right"       = "focus_window_or_workspace,right"
"SUPER+Up"          = "focus_window_or_workspace,up"
"SUPER+Down"        = "focus_window_or_workspace,down"

"SUPER+Ctrl+Left"   = "move_client,left"
"SUPER+Ctrl+Right"  = "move_client,right"
"SUPER+Ctrl+Up"     = "move_client,up"
"SUPER+Ctrl+Down"   = "move_client,down"

"SUPER+Shift+Left"  = "focusmon,left"
"SUPER+Shift+Right" = "focusmon,right"
"SUPER+Shift+Up"    = "focusmon,up"
"SUPER+Shift+Down"  = "focusmon,down"

[bind.default.lock]
"XF86MonBrightnessUp"   = "spawn_shell,noctalia msg brightness-up"
"XF86MonBrightnessDown" = "spawn_shell,noctalia msg brightness-down"
"XF86AudioRaiseVolume"  = "spawn_shell,noctalia msg volume-up"
"XF86AudioLowerVolume"  = "spawn_shell,noctalia msg volume-down"
"XF86AudioMute"         = "spawn_shell,noctalia msg volume-mute"
"XF86AudioPlay"         = "spawn_shell,playerctl play-pause"
"XF86AudioStop"         = "spawn_shell,playerctl stop"
"XF86AudioPrev"         = "spawn_shell,playerctl previous"
"XF86AudioNext"         = "spawn_shell,playerctl next"
