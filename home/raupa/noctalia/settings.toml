[notification]
layer = "overlay"

[osd.kinds]
lock_keys = false
media = false

[plugin_settings."frai3mega/battery-graph"]
battery-panel_placement = "attached"
graph_time = 24
interpol_time = 10

[plugin_settings."harveywuk/airpods"]
panel_open_near_click = false

[plugins]
enabled = [ "harveywuk/airpods", "yuuto/calculator", "piero-93/battery-power-management" ]

[shell]
button_borders = false
card_borders = false
date_format = "%A, %Y/%m/%d"
input_borders = false
lang = "en"
polkit_agent = true
popup_borders = false
popup_shadows = false
screen_time_enabled = true

    [shell.launcher]
    categories = false
    layout = "simple"

    [shell.panel]
    clipboard_placement = "attached"

[theme]
builtin = "Eldritch"
community_palette = "Aura"
mode = "dark"
pure_black_dark = true
source = "wallpaper"
wallpaper_scheme = "m3-monochrome"

    [theme.templates]
    builtin_ids = [ "cava", "gtk3", "gtk4", "ghostty", "niri", "qt" ]
    community_ids = [ "discord", "gimp", "obsidian", "steam", "obs" ]

[wallpaper]
directory_dark = "~/Wallpapers"
directory_light = "/home/raupa/Wallpapers"
transition = [ "honeycomb" ]

    [wallpaper.default]
    path = "/home/raupa/Wallpapers/darkearth.jpg"

    [wallpaper.last]
    path = "/home/raupa/Wallpapers/darkearth.jpg"

    [wallpaper.monitors.eDP-1]
    path = "/home/raupa/Wallpapers/darkearth.jpg"

    [[wallpaper.favorite]]
    community_palette = "ADW"
    palette_source = "community"
    path = "/home/raupa/Wallpapers/skyline.png"
    theme_mode = "dark"

[weather]
refresh_minutes = 15

[widget.airpods]
type = "harveywuk/airpods:airpods"

[widget.audio_visualizer]
bands = 32
width = 98

[widget.bar]
type = "yuuto/calculator:bar"

[widget.clock]
format = "{:%A %Y/%m/%d %H:%M}"

[widget.media]
hide_when_no_media = true
max_length = 200
min_length = 50
title_scroll = "on_hover"

    [widget.media.actions]
    scroll_down = "none"
    scroll_up = "none"

[widget.tray]
enabled = false

[widget.widget]
type = "piero-93/battery-power-management:widget"