config_version = 16

[bar]
order = [ "default" ]

    [bar.default]
    background_opacity = 0.4999999888241291
    end = [
        "airpods",
        "tray",
        "bluetooth",
        "network",
        "volume",
        "brightness",
        "widget",
        "clipboard",
        "bar",
        "notifications",
        "control-center",
        "session"
    ]
    font_family = "CaskaydiaMono NF"
    font_weight = 400
    margin_edge = 8
    margin_ends = 8
    padding = 10
    panel_overlap = 0
    radius = 8
    start = [ "launcher", "wallpaper", "screenshot", "workspaces", "media", "audio_visualizer" ]

[brightness]
enable_ddcutil = true
sync_all_monitors = true

[calendar]
enabled = true
event_date_format = "%B %A %e"
refresh_minutes = 10

    [calendar.account.personal_icloud]
    name = "Personal Calendar"
    provider = "icloud"
    type = "caldav"
    username = "raupacherwin@gmail.com"

[control_center.calendar]
show_week_numbers = true

[[control_center.shortcuts]]
type = "wifi"

[[control_center.shortcuts]]
type = "bluetooth"

[[control_center.shortcuts]]
type = "caffeine"

[[control_center.shortcuts]]
type = "nightlight"

[[control_center.shortcuts]]
type = "notification"

[[control_center.shortcuts]]
type = "keyboard_layout"

[desktop_widgets]
enabled = false
schema_version = 2
widget_order = [ "desktop-widget-0000000000000001", "desktop-widget-0000000000000002", "desktop-widget-0000000000000003" ]

    [desktop_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [desktop_widgets.widget.desktop-widget-0000000000000001]
    box_height = 192.0
    box_width = 256.0
    cx = 144.0
    cy = 162.0
    output = "eDP-1"
    placement_height = 900.0
    placement_width = 1440.0
    rotation = 0.0
    type = "clock"

    [desktop_widgets.widget.desktop-widget-0000000000000002]
    box_height = 0.0
    box_width = 0.0
    cx = 144.0
    cy = 828.0
    output = "eDP-1"
    placement_height = 900.0
    placement_width = 1440.0
    rotation = 0.0
    type = "audio_visualizer"

        [desktop_widgets.widget.desktop-widget-0000000000000002.settings]
        bands = 32
        show_when_idle = true

    [desktop_widgets.widget.desktop-widget-0000000000000003]
    box_height = 0.0
    box_width = 0.0
    cx = 720.0
    cy = 450.0
    output = "eDP-1"
    placement_height = 900.0
    placement_width = 1440.0
    rotation = 0.0
    type = "sysmon"

        [desktop_widgets.widget.desktop-widget-0000000000000003.settings]
        stat = "cpu_usage"
        stat2 = "cpu_temp"

[idle]
behavior_order = [ "lock", "lock-and-suspend" ]
pre_action_fade_seconds = 0

    [idle.behavior.lock]
    action = "lock"
    enabled = true
    timeout = 450.0

    [idle.behavior.lock-and-suspend]
    action = "suspend"
    enabled = true
    lock_before_suspend = false
    timeout = 900.0

[location]
auto_locate = true

[lockscreen]
transition = [ "honeycomb" ]

